# Builds this fork's image and publishes it to GHCR, so install.sh can just
# pull it instead of making every user build from source.
#
# Why a separate workflow instead of editing build.yml:
#   - build.yml pushes to Docker Hub and needs DOCKERHUB_USERNAME/DOCKERHUB_TOKEN,
#     which a fork does not have. This one uses GHCR only, which authenticates
#     with the built-in GITHUB_TOKEN - no secrets to configure.
#   - build.yml only runs on a published release. This also runs on every push
#     to main, so `:latest` tracks the branch and there is always an image.
#   - it compiles the dashboard with bun first; this one does not need to,
#     because the Dockerfile copies the compiled dashboard out of upstream's
#     published image.
#
# ONE-TIME SETUP after the first successful run:
#   the GHCR package is created private. Make it public so installs work without
#   a login: repo -> Packages -> pasarguard-free-configs -> Package settings ->
#   Change visibility -> Public.

name: Build fork image (GHCR)

on:
    push:
        branches: [main]
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    build-image:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Lowercase the image name
              id: image
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ steps.image.outputs.name }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=tag
                      type=sha,format=short
                      type=raw,value=latest,enable={{is_default_branch}}

            # The Dockerfile lifts the compiled dashboard out of upstream's
            # published image, so there is no Node toolchain step here.
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Summary
              run: |
                  echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  echo "If this is the first run, make the package public:" >> "$GITHUB_STEP_SUMMARY"
                  echo "repo -> Packages -> Package settings -> Change visibility -> Public" >> "$GITHUB_STEP_SUMMARY"
