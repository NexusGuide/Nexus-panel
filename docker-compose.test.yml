# Build-and-run THIS fork, for testing the free-configs feature.
#
# The main docker-compose.yml pulls the published upstream image
# (pasarguard/panel:latest) - it does NOT contain this fork's code. Use this
# file instead when you want to run what you actually built.
#
#   docker compose -f docker-compose.test.yml up --build -d
#
# Differences from the production compose file:
#   - builds from source instead of pulling an image
#   - SQLite in a bind mount: no external database needed for a test run
#   - docs enabled so /docs is browsable
#
# Networking note: both the build and the container use the host network.
# On plenty of VPSes, Docker's default bridge network cannot resolve DNS
# (`apt-get update` fails with "Temporary failure resolving deb.debian.org"),
# which breaks the build and would also stop the free-configs fetcher from
# reaching its sources. Using the host network sidesteps that entirely - and it
# matches what upstream's own docker-compose.yml does.
#
# Because host networking ignores `ports:`, exposure is controlled by making the
# app itself bind to loopback (UVICORN_HOST below - and without SSL configured
# upstream already falls back to localhost anyway). Reach it over an SSH tunnel:
#     ssh -L 8000:127.0.0.1:8000 user@your-vps
# then open http://localhost:8000/docs on your own machine.

services:
  panel:
    build:
      context: .
      network: host
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./test-data:/var/lib/pasarguard
    environment:
      # --- test-only conveniences -------------------------------------------
      # NOTE: do NOT set DEBUG here. In main.py, debug mode force-binds to
      # 0.0.0.0 (ignoring UVICORN_HOST) and starts the dashboard dev server,
      # which needs `bun` - absent from the production image, so the app
      # crash-loops with FileNotFoundError: 'bun'.
      DOCS: "true"
      SQLALCHEMY_DATABASE_URL: "sqlite+aiosqlite:////var/lib/pasarguard/db.sqlite3"
      # loopback only - a test panel has no business being on the public internet
      UVICORN_HOST: "127.0.0.1"
      UVICORN_PORT: "8000"
      # --- the feature under test -------------------------------------------
      FREE_CONFIGS_ENABLED: "true"
      FREE_CONFIGS_MODE: "all"
      # keep the first test run quick: cap the pool and use a short timeout
      FREE_CONFIGS_MAX_CONFIGS: "300"
      FREE_CONFIGS_TCP_TIMEOUT: "2"
      FREE_CONFIGS_MAX_CONCURRENCY: "80"
